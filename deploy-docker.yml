---
- name: Deploy accounts-app Docker container
  hosts: localhost
  become: true  # Enable sudo for the tasks
  become_user: root  # Run as root user (optional)
  become_method: sudo  # Use sudo for privilege escalation

  tasks:
    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes
      when: ansible_os_family == "Debian"  # If the system is Debian-based (Ubuntu, etc.)

    - name: Start Docker service
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull the Docker image from Docker Hub
      docker_image:
        name: anitharaji2007/accounts-app
        tag: latest
        source: pull

    - name: Run the Docker container
      docker_container:
        name: accounts-app
        image: anitharaji2007/accounts-app:latest
        state: started
        ports:
          - "8081:8081"
        restart_policy: always

    - name: Verify the running container
      command: docker ps
      register: docker_ps_output

    - name: Show the running containers
      debug:
        var: docker_ps_output.stdout_lines
